<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سباق التوك توك 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1a1210; font-family: Tahoma, Arial, sans-serif; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud {
    direction: ltr;
    position: fixed; top: 10px; left: 0; right: 0; display: flex;
    justify-content: space-between; padding: 0 14px; pointer-events: none;
    color: #fff; font-weight: bold; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,.6); z-index: 5;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(20,10,8,.82); color: #fff; text-align: center; z-index: 10;
  }
  .overlay h1 { font-size: 38px; margin-bottom: 8px; color: #ffb347; }
  .overlay p { font-size: 17px; margin: 6px 0; color: #f5e6d3; }
  .overlay button {
    margin-top: 22px; padding: 14px 42px; font-size: 22px; font-weight: bold;
    background: #e2543e; color: #fff; border: none; border-radius: 14px; cursor: pointer;
    box-shadow: 0 4px 0 #a03826;
  }
  .overlay button:active { transform: translateY(3px); box-shadow: none; }
  .hidden { display: none; }
  .small { font-size: 14px !important; color: #cbb !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="score">0</div>
  <div id="best">أفضل: 0</div>
</div>
<div id="menu" class="overlay">
  <h1>🛺 سباق التوك توك</h1>
  <p>عدّي من زحمة القاهرة وأوعى تخبط!</p>
  <p class="small">اسحب يمين وشمال أو استخدم الأسهم عشان تغيّر الحارة</p>
  <button id="startBtn">يلا بينا</button>
</div>
<div id="gameover" class="overlay hidden">
  <h1>خبطت! 💥</h1>
  <p id="finalScore"></p>
  <p id="finalBest" class="small"></p>
  <button id="retryBtn">حاول تاني</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- UI ----------
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const menu = document.getElementById('menu');
  const gameover = document.getElementById('gameover');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');

  // ---------- Renderer / scene ----------
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const SKY = 0xf2cf9a;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 35, 150);

  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 400);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Lights ----------
  const hemi = new THREE.HemisphereLight(0xfff3da, 0x8a6f4d, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffe2b0, 1.15);
  sun.position.set(18, 34, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
  sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -60;
  sun.shadow.camera.far = 120;
  scene.add(sun);
  scene.add(sun.target);

  // ---------- Road ----------
  const ROAD_HALF = 6.2;
  const LANES = [-3, 0, 3];
  const roadMat = new THREE.MeshLambertMaterial({ color: 0x35302c });
  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF * 2 + 1.4, 400), roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.z = -160;
  road.receiveShadow = true;
  scene.add(road);

  const sideMat = new THREE.MeshLambertMaterial({ color: 0x9c8468 });
  for (const s of [-1, 1]) {
    const sw = new THREE.Mesh(new THREE.PlaneGeometry(9, 400), sideMat);
    sw.rotation.x = -Math.PI / 2;
    sw.position.set(s * (ROAD_HALF + 0.7 + 4.5), 0.02, -160);
    sw.receiveShadow = true;
    scene.add(sw);
  }

  // lane dashes (recycled)
  const dashMat = new THREE.MeshBasicMaterial({ color: 0xe8e0d0 });
  const dashGeo = new THREE.PlaneGeometry(0.18, 2.2);
  const dashes = [];
  for (const x of [-1.5, 1.5]) {
    for (let i = 0; i < 22; i++) {
      const d = new THREE.Mesh(dashGeo, dashMat);
      d.rotation.x = -Math.PI / 2;
      d.position.set(x, 0.03, 20 - i * 8);
      scene.add(d);
      dashes.push(d);
    }
  }

  // ---------- Buildings ----------
  function facadeTexture(base, win) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 64, 128);
    g.fillStyle = win;
    for (let y = 10; y < 118; y += 18)
      for (let x = 8; x < 56; x += 16)
        g.fillRect(x, y, 9, 11);
    const t = new THREE.CanvasTexture(c);
    return t;
  }
  const facades = [
    facadeTexture('#c9a97e', '#5e4a33'),
    facadeTexture('#b98d63', '#4f3d2a'),
    facadeTexture('#d8c39a', '#6b5638'),
    facadeTexture('#a8875f', '#453423')
  ];

  const buildingMats = facades.map(t => new THREE.MeshLambertMaterial({ map: t }));
  const buildings = [];
  for (let i = 0; i < 26; i++) {
    const w = 5 + Math.random() * 5;
    const h = 6 + Math.random() * 14;
    const dep = 6 + Math.random() * 4;
    const s = i % 2 === 0 ? -1 : 1;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, dep), buildingMats[i % buildingMats.length]);
    b.position.set(s * (ROAD_HALF + 3 + w / 2 + Math.random() * 2), h / 2, 25 - Math.floor(i / 2) * 14 - Math.random() * 5);
    b.castShadow = true;
    b.receiveShadow = true;
    scene.add(b);
    buildings.push(b);
  }

  // ---------- Palms ----------
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x7a5c3a });
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x4e7d3a });
  function makePalm() {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 3.4, 5), trunkMat);
    trunk.position.y = 1.7;
    trunk.castShadow = true;
    g.add(trunk);
    for (let i = 0; i < 5; i++) {
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.32, 2.0, 4), leafMat);
      const a = (i / 5) * Math.PI * 2;
      leaf.position.set(Math.cos(a) * 0.8, 3.5, Math.sin(a) * 0.8);
      leaf.rotation.z = Math.cos(a) * 1.15;
      leaf.rotation.x = -Math.sin(a) * 1.15;
      leaf.castShadow = true;
      g.add(leaf);
    }
    return g;
  }
  const palms = [];
  for (let i = 0; i < 12; i++) {
    const p = makePalm();
    const s = i % 2 === 0 ? -1 : 1;
    p.position.set(s * (ROAD_HALF + 1.6), 0, 20 - Math.floor(i / 2) * 26);
    scene.add(p);
    palms.push(p);
  }

  // ---------- Tuk-tuk ----------
  const tuktuk = new THREE.Group();
  {
    const yellow = new THREE.MeshLambertMaterial({ color: 0xf2a71b });
    const blue = new THREE.MeshLambertMaterial({ color: 0x1b6ec2 });
    const dark = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const glass = new THREE.MeshLambertMaterial({ color: 0xbfe8ff });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.9, 2.3), yellow);
    body.position.y = 0.75;
    body.castShadow = true;
    tuktuk.add(body);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.85, 1.5), blue);
    cabin.position.set(0, 1.55, 0.25);
    cabin.castShadow = true;
    tuktuk.add(cabin);

    const shield = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 0.08), glass);
    shield.position.set(0, 1.5, -0.55);
    shield.rotation.x = 0.25;
    tuktuk.add(shield);

    const wheelGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.2, 10);
    wheelGeo.rotateZ(Math.PI / 2);
    for (const [x, z] of [[-0.7, 0.7], [0.7, 0.7], [0, -0.85]]) {
      const w = new THREE.Mesh(wheelGeo, dark);
      w.position.set(x, 0.28, z);
      w.castShadow = true;
      tuktuk.add(w);
    }
    const light = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff8b0 }));
    light.position.set(0, 0.8, -1.18);
    tuktuk.add(light);
  }
  scene.add(tuktuk);

  // ---------- Obstacles ----------
  const carColors = [0x3e6ae2, 0xc23b2e, 0xe8e3d8, 0x3f8f4f, 0x8a4fb0];
  function makeCar() {
    const g = new THREE.Group();
    const color = carColors[Math.floor(Math.random() * carColors.length)];
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 3.4), new THREE.MeshLambertMaterial({ color }));
    body.position.y = 0.55; body.castShadow = true;
    g.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, 1.7), new THREE.MeshLambertMaterial({ color: 0x2a2f38 }));
    cabin.position.set(0, 1.1, 0.2); cabin.castShadow = true;
    g.add(cabin);
    const wg = new THREE.CylinderGeometry(0.3, 0.3, 0.25, 8); wg.rotateZ(Math.PI / 2);
    const wm = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
    for (const [x, z] of [[-0.85, 1.1], [0.85, 1.1], [-0.85, -1.1], [0.85, -1.1]]) {
      const w = new THREE.Mesh(wg, wm); w.position.set(x, 0.3, z); g.add(w);
    }
    g.userData.half = { w: 0.95, l: 1.75 };
    return g;
  }
  function makeMicrobus() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.9, 4.2), new THREE.MeshLambertMaterial({ color: 0xe8e3d8 }));
    body.position.y = 1.15; body.castShadow = true;
    g.add(body);
    const band = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.5, 3.2), new THREE.MeshLambertMaterial({ color: 0x2a2f38 }));
    band.position.set(0, 1.55, 0.2);
    g.add(band);
    g.userData.half = { w: 1.05, l: 2.15 };
    return g;
  }
  function makeTruck() {
    const g = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.4, 4.6), new THREE.MeshLambertMaterial({ color: 0x7a4a2b }));
    box.position.set(0, 1.6, 0.4); box.castShadow = true;
    g.add(box);
    const cab = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.4, 1.5), new THREE.MeshLambertMaterial({ color: 0x59351e }));
    cab.position.set(0, 0.9, 3.0); cab.castShadow = true;
    g.add(cab);
    g.userData.half = { w: 1.15, l: 2.7 };
    return g;
  }
  function makePothole() {
    const g = new THREE.Group();
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.06, 12), new THREE.MeshLambertMaterial({ color: 0x120e0c }));
    p.position.y = 0.04;
    g.add(p);
    g.userData.half = { w: 0.8, l: 0.8 };
    return g;
  }
  const makers = [makeCar, makeCar, makeMicrobus, makeTruck, makePothole];

  const obstacles = [];
  function spawn() {
    let lane = Math.floor(Math.random() * 3);
    // keep at least one lane free near each spawn depth
    const near = obstacles.filter(o => o.position.z < -95 && o.position.z > -140);
    const used = new Set(near.map(o => o.userData.lane));
    if (used.size >= 2) {
      const free = [0, 1, 2].find(l => !used.has(l));
      if (free !== undefined) lane = free;
    }
    const o = makers[Math.floor(Math.random() * makers.length)]();
    o.position.set(LANES[lane], 0, -130);
    o.userData.lane = lane;
    scene.add(o);
    obstacles.push(o);
  }

  // ---------- Dust particles ----------
  const P = 80;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(P * 3);
  const pLife = new Float32Array(P).fill(0);
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({ color: 0xcbb089, size: 0.55, transparent: true, opacity: 0.7 });
  const dust = new THREE.Points(pGeo, pMat);
  dust.frustumCulled = false;
  scene.add(dust);
  let pNext = 0;
  function puff(x, y, z) {
    pPos[pNext * 3] = x + (Math.random() - 0.5) * 0.6;
    pPos[pNext * 3 + 1] = y;
    pPos[pNext * 3 + 2] = z;
    pLife[pNext] = 1;
    pNext = (pNext + 1) % P;
  }

  // ---------- State ----------
  let lane = 1, playerX = 0, running = false;
  let score = 0, best = +(localStorage.getItem('tuktuk3d_best') || 0);
  let speed, baseSpeed = 16, lastTime = 0, spawnTimer = 0, puffTimer = 0;

  function start() {
    for (const o of obstacles) scene.remove(o);
    obstacles.length = 0;
    lane = 1; playerX = 0;
    score = 0; speed = baseSpeed; spawnTimer = 0.5;
    running = true;
    menu.classList.add('hidden');
    gameover.classList.add('hidden');
    lastTime = performance.now();
  }

  function end() {
    running = false;
    score = Math.floor(score);
    if (score > best) { best = score; localStorage.setItem('tuktuk3d_best', best); }
    finalScore.textContent = 'مسافتك: ' + score + ' متر';
    finalBest.textContent = 'أفضل مسافة: ' + best + ' متر';
    bestEl.textContent = 'أفضل: ' + best;
    gameover.classList.remove('hidden');
  }

  function update(dt) {
    speed = Math.min(baseSpeed * 2.4, speed + dt * 0.55);
    score += speed * dt;
    scoreEl.textContent = Math.floor(score);

    const targetX = LANES[lane];
    playerX += (targetX - playerX) * Math.min(1, dt * 9);
    tuktuk.position.x = playerX;
    tuktuk.position.y = Math.abs(Math.sin(performance.now() * 0.012)) * 0.05;
    tuktuk.rotation.z = (targetX - playerX) * -0.12;

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = Math.max(0.55, 1.35 - (speed / baseSpeed) * 0.4); }

    for (const o of obstacles) o.position.z += speed * dt;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      if (o.position.z > 15) { scene.remove(o); obstacles.splice(i, 1); continue; }
      if (o.userData.lane === lane && Math.abs(o.position.z) < o.userData.half.l + 1.0) { end(); return; }
    }

    for (const d of dashes) { d.position.z += speed * dt; if (d.position.z > 24) d.position.z -= 176; }
    for (const b of buildings) { b.position.z += speed * dt; if (b.position.z > 40) b.position.z -= 182; }
    for (const p of palms) { p.position.z += speed * dt; if (p.position.z > 30) p.position.z -= 140; }

    puffTimer -= dt;
    if (puffTimer <= 0) { puff(playerX, 0.25, 1.3); puffTimer = 0.08; }
    for (let i = 0; i < P; i++) {
      if (pLife[i] > 0) {
        pLife[i] -= dt * 1.6;
        pPos[i * 3 + 1] += dt * 0.8;
        pPos[i * 3 + 2] += speed * dt * 0.9;
        if (pLife[i] <= 0) pPos[i * 3 + 1] = -10;
      }
    }
    pGeo.attributes.position.needsUpdate = true;
  }

  function render() {
    camera.position.set(playerX * 0.55, 5.4, 8.6);
    camera.lookAt(playerX * 0.7, 1.1, -12);
    sun.position.set(playerX + 18, 34, 12);
    sun.target.position.set(playerX, 0, -20);
    sun.target.updateMatrixWorld();
    renderer.render(scene, camera);
  }

  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;
    if (running) update(dt);
    render();
  }

  function move(dir) {
    if (!running) return;
    lane = Math.max(0, Math.min(2, lane + dir));
  }

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'ArrowRight') move(1);
  });
  let touchX = null;
  window.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  window.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 24) move(dx > 0 ? 1 : -1);
    else move(e.changedTouches[0].clientX > window.innerWidth / 2 ? 1 : -1);
    touchX = null;
  }, { passive: true });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);

  bestEl.textContent = 'أفضل: ' + best;
  if (location.hash === '#autoplay') { start(); for (let i = 0; i < 90 && running; i++) update(0.05); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
